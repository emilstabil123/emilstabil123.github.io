<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8">
    <title>Din kurv</title>
    <link rel="stylesheet" href="styles.css">
    
  </head>

  <header>
        <nav class="topbar">

            <div>
                Kamph Honeteknik
                <button onclick="window.location.href='tysk.html'">🇩🇪</button>
                <button onclick="window.location.href='engelsk.html'">🇬🇧</button>
            </div>
            
            <nav>
                <a href="index.html">Hjem</a>
                <a href="Products.html">Produkter</a>
                <a href="Contact.html">Kontakt os</a>
            </nav>

            <a class="cart" href="cart.html" aria-label="Kurv">
            🛒 <span id="resultat">0</span>
            </a>

  <body>
    <div class="cart-top">
      <h1>Din ordre</h1>

      <div class="checkout-row">
        <a class="checkout-button" href="checkout.html">Gå til betaling</a>
      </div>
    </div>







    <div class="cart-product">
      <h2>Honebørste Standard</h2>

      <button onclick="fjernStandard()">−</button>
      <span id="standard-antal">0</span>
      <button onclick="addStandard()">+</button>

      <p>249 kr. pr. stk.</p>
    </div>

    <div class="cart-product">
      <h2>Honebørste Pro</h2>

      <button onclick="fjernPro()">−</button>
      <span id="pro-antal">0</span>
      <button onclick="addPro()">+</button>

      <p>389 kr. pr. stk.</p>
    </div>

    <div class="cart-product">
      <h2>Honebørste Compact</h2>

      <button onclick="fjernCompact()">−</button>
      <span id="compact-antal">0</span>
      <button onclick="addCompact()">+</button>

      <p>199 kr. pr. stk.</p>
    </div>



    <h1>Samlet pris: <span id="total-pris">0 kr.</span></h1>
    

    <script src="script.js"></script>
